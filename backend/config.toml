# FinExtract configuration.
#
# This file holds non-secret, deployment-tunable settings. It is read at startup by
# app/config.py (via pydantic-settings). Precedence, highest first:
#
#   1. Environment variables (prefix FINEX_, nested with "__", e.g. FINEX_LLM__MODEL)
#   2. .env file
#   3. THIS file (config.toml)
#   4. Built-in defaults in app/config.py
#
# NEVER put secrets (API keys, DB passwords) here. Keys are read from environment
# variables named by *_api_key_env below, so this file can live safely in git.

[app]
name = "FinExtract Extraction API"
api_prefix = "/api/v1"

# ---------------------------------------------------------------------------
# Authentication / session
# ---------------------------------------------------------------------------
[auth]
# Accept the X-Role request header as a dev/service credential, but ONLY when the
# request has no valid session token (a real session always wins, so this can never
# escalate or downgrade a logged-in user). OFF by default — turn it on explicitly for
# local dev / CI / machine-to-machine calls; leave it off in production.
allow_role_header = false

# Passwordless quick-login for the seeded demo users (the "Sign in as …" buttons on
# the login screen). SET TO false IN PRODUCTION — real users must supply a password.
demo_mode = true

# Session lifetime, in minutes, before a token must be re-issued.
session_ttl_minutes = 480

# ---------------------------------------------------------------------------
# Feature flags (admin-configurable)
# ---------------------------------------------------------------------------
[features]
# Localize the ENTIRE interface (nav, screens, prose), not just the extracted
# financial output. Off by default: by default only statement line items and notes
# follow the chosen output language; the rest of the app stays English. An admin can
# flip this at runtime from the Settings screen (PATCH /settings) — this value is the
# startup default.
ui_localization = false

# Require a second-person reviewer sign-off on the analyst's output. When false the
# workflow closes at the analyst level (they finalize & export directly). This governs
# the sign-off/hand-off only — the human-in-the-loop Review Queue (checks + low-confidence
# QA) stays available to the analyst regardless. Startup default; admin-flippable.
review_required = true

# Load the seeded sample project at startup. False → the app starts greenfield
# (empty); an admin can load or clear the sample at runtime from the Settings screen.
seed_demo = false

# Default output language for extracted financial data, and the set of languages the
# app offers. Adding a language is a data/asset change, not a code change.
default_output_locale = "en"
supported_locales = ["en", "zh", "ar", "fr"]

# ---------------------------------------------------------------------------
# LLM (used for extraction disambiguation + could back the analysis commentary).
# The adapter is selected by the top-level llm_provider registry id; this section
# configures whichever adapter is selected.
# ---------------------------------------------------------------------------
[llm]
# anthropic          → Anthropic Messages API (SDK)
# openai / openai_compatible → OpenAI Chat Completions wire format (OpenAI, TokenRouter,
#                      OpenRouter, vLLM, …); set base_url + a vendor/model id below
# local | stub       → offline / no-op
provider = "anthropic"
model = "claude-opus-4-8"       # default model id for the selected provider
temperature = 0.0               # deterministic output for structured extraction
max_tokens = 4096
timeout_seconds = 60
base_url = ""                   # override for a self-hosted / gateway endpoint; empty = provider default
api_key_env = "ANTHROPIC_API_KEY"   # env var the key is read from (the key itself is NOT stored here)

# ---------------------------------------------------------------------------
# OCR (scanned-page recognition)
# ---------------------------------------------------------------------------
[ocr]
engine = "docling"              # docling (free, recommended) | azure | paddleocr | tesseract | stub
languages = ["en", "ch", "ar", "fr"]   # OCR language packs to load
dpi = 300                       # rasterization DPI for scanned pages

# Azure AI Document Intelligence (used when engine = "azure"). The key is NOT here —
# it's read from the env var named by azure_api_key_env (default AZURE_DI_KEY).
azure_endpoint = ""             # https://<resource>.cognitiveservices.azure.com
azure_model = "prebuilt-layout" # prebuilt-layout | prebuilt-read
azure_api_version = "2024-11-30"
azure_api_key_env = "AZURE_DI_KEY"

# ---------------------------------------------------------------------------
# Embeddings (semantic alias matching in the mapping ensemble)
# ---------------------------------------------------------------------------
[embeddings]
provider = "sentence-transformers"     # sentence-transformers | openai | stub
model = "paraphrase-multilingual-MiniLM-L12-v2"

# ---------------------------------------------------------------------------
# Extraction / reconciliation tuning
# ---------------------------------------------------------------------------
[extraction]
fuzzy_accept = 0.70             # combined (coverage-weighted) fuzzy score to auto-accept alone
fuzzy_min_alias_coverage = 0.60 # …and the caption must explain this much of the matched alias
fuzzy_candidate = 0.60          # minimum score to keep a fuzzy match as a candidate
embedding_accept = 0.82         # cosine similarity to accept a semantic match
mapping_margin = 0.08           # winner must beat the runner-up by this margin, else review
auto_accept_confidence = 0.80   # combined confidence at/above which a line auto-accepts
recon_abs_tolerance = 1.0       # absolute tolerance (in base units) for reconciliation ties
recon_rel_tolerance = 0.005     # relative tolerance (fraction of the face value)
